<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>MIDI Audio Mixer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="toolbar">
    <div class="toolbar-left">
        <div class="logo">🎚️ MIDI Mixer</div>
        <select id="midiInput">
            <option value="">Выбрать MIDI устройство</option>
        </select>
        <select id="profileSelect">
            <option value="">Профиль по умолчанию</option>
        </select>
    </div>
    <div class="toolbar-right">
        <div class="status-indicator">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Не подключено</span>
        </div>
        <button class="btn" onclick="addStandaloneButton()">+ Кнопка</button>
        <button class="btn" onclick="openProfileModal()">Профили</button>
        <button class="btn" onclick="openSettings()">⚙️</button>
    </div>
</div>

<div class="mixer-container" id="mixerContainer">
    <div class="empty-state">
        <div class="empty-state-icon">🎛️</div>
        <div class="empty-state-text">
            Нажмите «+» справа, чтобы добавить канал<br>
            или «+ Кнопка» для отдельной кнопки
        </div>
    </div>
    <div class="add-channel-strip" onclick="addChannel()">
        <div class="add-channel-plus">+</div>
    </div>
</div>

<div class="standalone-buttons" id="standaloneButtons"></div>

<!-- Модалка добавления канала -->
<div class="modal" id="channelModal">
    <div class="modal-content">
        <div class="modal-header">Добавить канал</div>
        <div class="form-group">
            <label class="form-label">Приложение</label>
            <select class="form-input" id="modalAppSelect">
                <option value="">Загрузка...</option>
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">Количество кнопок</label>
            <input type="number" class="form-input" id="modalButtonCount" value="4" min="0" max="8">
        </div>
        <div class="modal-actions">
            <button class="btn" onclick="closeModal()">Отмена</button>
            <button class="btn btn-primary" onclick="createChannel()">Создать</button>
        </div>
    </div>
</div>

<!-- Модалка настройки кнопки -->
<div class="modal" id="buttonModal">
    <div class="modal-content">
        <div class="modal-header">Настройка кнопки</div>
        <div class="form-group">
            <label class="form-label">Текст</label>
            <input type="text" class="form-input" id="buttonText" placeholder="Mute">
        </div>
        <div class="form-group">
            <label class="form-label">Иконка (эмодзи)</label>
            <input type="text" class="form-input" id="buttonIcon" placeholder="🔇">
        </div>
        <div class="form-group">
            <label class="form-label">MIDI Note</label>
            <input type="number" class="form-input" id="buttonNote" value="60" min="0" max="127">
        </div>
        <div class="form-group">
            <label class="form-label">Клавиша (опционально)</label>
            <input type="text" class="form-input" id="buttonKey" placeholder="Нажмите клавишу..." readonly>
        </div>
        <div class="modal-actions">
            <button class="btn" onclick="closeButtonModal()">Отмена</button>
            <button class="btn btn-primary" onclick="saveButtonConfig()">Сохранить</button>
        </div>
    </div>
</div>

<!-- Контейнер уведомлений -->
<div id="toastContainer"></div>

<!-- Контекстное меню -->
<div id="contextMenu" class="context-menu">
    <div class="context-item" data-action="edit">Изменить</div>
    <div class="context-item" data-action="remap">Переназначить</div>
    <div class="context-item" data-action="delete">Удалить</div>
</div>

<!-- Панель настроек -->
<div id="settingsPanel" class="settings-panel">
    <div class="settings-header">
        <span>Настройки</span>
        <button class="settings-close" onclick="closeSettings()">×</button>
    </div>
    <div class="settings-content">
        <label class="settings-item">
            <span>Режим разработчика</span>
            <div class="settings-toggle disabled">Выкл</div>
        </label>
        <label class="settings-item">
            <span>Продвинутый режим</span>
            <div class="settings-toggle" id="advancedModeToggle">Выкл</div>
        </label>
        <label class="settings-item">
            <span>Start on boot</span>
            <div class="settings-toggle disabled">Выкл</div>
        </label>

        <div id="advancedInfo" class="advanced-info hidden">
            <div class="settings-subtitle">Входящие MIDI сообщения</div>
            <pre id="advancedMidiLog" class="advanced-log"></pre>
        </div>
    </div>
</div>
<div id="settingsBackdrop" class="settings-backdrop" onclick="closeSettings()"></div>

<script src="app.js"></script>
</body>
</html>
