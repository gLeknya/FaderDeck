<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>FaderDeck</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<div class="toolbar">
    <div class="toolbar-section toolbar-left">
        <button class="btn icon-btn" onclick="openSettings()">⚙️</button>
        <select id="midiInput">
            <option value="">Select MIDI device</option>
        </select>
        <div class="status-indicator">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">not connected</span>
        </div>  
    </div>  
    <div class="toolbar-section toolbar-center">
        <img src="../assets/FaderDeckIcon256x256.png" class="toolbar-icon" alt="">
        <span class="toolbar-title">FaderDeck</span>
    </div>  
    <div class="toolbar-section toolbar-right">  
        <div class="window-controls">
            <button class="window-btn" data-action="minimize">🗕</button>
            <button class="window-btn" data-action="maximize">🗖</button>
            <button class="window-btn window-btn-close" data-action="close">✕</button>
        </div>
    </div>
</div>


<div class="mixer-container" id="mixerContainer">
    <div class="empty-state">
        <div class="empty-state-icon">🎛️</div>
        <div class="empty-state-text">
            Click “+” on the right to add a channel<br>
            or “+ Button” to add a standalone button
        </div>
    </div>
    <div class="add-channel-strip" onclick="createChannel()">
        <div class="add-channel-plus">+</div>
    </div>
</div>

<div class="standalone-buttons" id="standaloneButtons"></div>

<!-- Модалка настройки кнопки -->
<div class="modal" id="buttonModal">
    <div class="modal-content">
        <div class="modal-header">Button settings</div>
        <div class="form-group">
            <label class="form-label">Text</label>
            <input type="text" class="form-input" id="buttonText" placeholder="Mute">
        </div>
        <div class="form-group">
            <label class="form-label">Icon</label>
            <input type="text" class="form-input" id="buttonIcon" placeholder="🔇">
        </div>
        <div class="form-group">
            <label class="form-label">MIDI Note</label>
            <input type="number" class="form-input" id="buttonNote" value="60" min="0" max="127">
        </div>
        <div class="form-group">
            <label class="form-label">Key</label>
            <input type="text" class="form-input" id="buttonKey" placeholder="Нажмите клавишу..." readonly>
        </div>
        <div class="modal-actions">
            <button class="btn" onclick="closeButtonModal()">Cancel</button>
            <button class="btn btn-primary" onclick="saveButtonConfig()">Save</button>
        </div>
    </div>
</div>

<!-- Контейнер уведомлений -->
<div id="toastContainer"></div>

<!-- Контекстное меню -->
<div id="contextMenu" class="context-menu">
    <div class="context-item" data-action="edit">Edit</div>
    <div class="context-item" data-action="remap">Reassign</div>
    <div class="context-item" data-action="delete">Delete</div>
</div>

<!-- Панель настроек -->
<div id="settingsPanel" class="settings-panel">
    <div class="settings-header">
        <span>Settings</span>
        <button class="settings-close" onclick="closeSettings()">×</button>
    </div>
    <div class="settings-content">
        <label class="settings-item">
            <span>Developer mode</span>
            <div class="settings-toggle disabled">Off</div>
        </label>
        <label class="settings-item">
            <span>Advanced mode</span>
            <div class="settings-toggle" id="advancedModeToggle">Off</div>
        </label>
        <label class="settings-item">
            <span>Start on boot</span>
            <div class="settings-toggle disabled">Off</div>
        </label>
        <label class="settings-item">
            <span>Language</span>
            <select id="languageSelect" class="settings-select">
                <option value="ru">Русский</option>
                <option value="en">English</option>
            </select>
        </label>

        <div id="advancedInfo" class="advanced-info hidden">
            <div class="settings-subtitle">Входящие MIDI сообщения</div>
            <pre id="advancedMidiLog" class="advanced-log"></pre>
        </div>
    </div>
</div>
<div id="settingsBackdrop" class="settings-backdrop" onclick="closeSettings()"></div>

<script src="js/toasts.js"></script>
<script src="js/channels.js"></script>
<script src="js/buttons.js"></script>
<script src="js/midi-ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
