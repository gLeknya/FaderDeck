<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: asset: https://asset.localhost; font-src 'self' data:; connect-src 'self' ipc: http://ipc.localhost https://ipc.localhost;"
    />
    <title>Debug Panel</title>
    <link rel="stylesheet" href="../scroll-lib/styles/fader-scroll.css" />
    <link rel="stylesheet" href="../fader-scroll-theme.css" />
    <link rel="stylesheet" href="debug-panel.css" />
  </head>
  <body>
    <div class="debug-panel" id="debugPanel">
      <div class="debug-panel__header" id="debugHeader">
        <div class="debug-panel__title-row">
          <span class="debug-panel__title">Debug Panel</span>
          <span class="debug-panel__version" id="appVersion"></span>
        </div>
        <button class="debug-panel__close" id="debugCloseBtn" title="Close">&#x2715;</button>
      </div>

      <div class="debug-panel__body-host sb-host">
        <div class="debug-panel__body" id="debugBody" data-scroll="y" data-scroll-preset="thin">
          <!-- Sections injected by JS -->
        </div>
      </div>
    </div>

    <script src="../js/adapters/tauri.global.js"></script>
    <script src="debug-panel-bridge.js"></script>
    <script src="debug-panel.js"></script>
    <script type="module" src="../js/fader-scroll-bridge.js"></script>
  </body>
</html>
